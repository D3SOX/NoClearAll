name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NOCLEARALL_KEYSTORE_PATH: ${{ github.workspace }}/noclearall-release.p12
      NOCLEARALL_KEYSTORE_PASSWORD: ${{ secrets.NOCLEARALL_KEYSTORE_PASSWORD }}
      NOCLEARALL_KEY_ALIAS: ${{ secrets.NOCLEARALL_KEY_ALIAS }}
      NOCLEARALL_KEY_PASSWORD: ${{ secrets.NOCLEARALL_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Restore release signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.NOCLEARALL_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          test -n "$NOCLEARALL_KEYSTORE_PASSWORD"
          test -n "$NOCLEARALL_KEY_ALIAS"
          test -n "$NOCLEARALL_KEY_PASSWORD"
          umask 077
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$NOCLEARALL_KEYSTORE_PATH"

      - name: Build and lint release APK
        run: ./gradlew :app:assembleRelease :app:lintRelease

      - name: Verify and name release APK
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          release_apk="NoClearAll-${GITHUB_REF_NAME}.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          test "$(unzip -p "$apk" META-INF/xposed/scope.list)" = "com.android.systemui"
          cp "$apk" "$release_apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "NoClearAll-${GITHUB_REF_NAME}.apk" \
            --verify-tag \
            --generate-notes \
            --title "NoClearAll ${GITHUB_REF_NAME}"
