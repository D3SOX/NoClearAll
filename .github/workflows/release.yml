name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NOCLEARALL_KEYSTORE_PATH: ${{ github.workspace }}/noclearall-release.p12
      NOCLEARALL_KEYSTORE_PASSWORD: ${{ secrets.NOCLEARALL_KEYSTORE_PASSWORD }}
      NOCLEARALL_KEY_ALIAS: ${{ secrets.NOCLEARALL_KEY_ALIAS }}
      NOCLEARALL_KEY_PASSWORD: ${{ secrets.NOCLEARALL_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.NOCLEARALL_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          test -n "$NOCLEARALL_KEYSTORE_PASSWORD"
          test -n "$NOCLEARALL_KEY_ALIAS"
          test -n "$NOCLEARALL_KEY_PASSWORD"
          umask 077
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$NOCLEARALL_KEYSTORE_PATH"

      - name: Build and lint release APK
        run: ./gradlew :app:assembleRelease :app:lintRelease

      - name: Verify and name release files
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          release_apk="NoClearAll-${GITHUB_REF_NAME}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          test "$(unzip -p "$apk" META-INF/xposed/scope.list)" = "com.android.systemui"
          cp "$apk" "$release_apk"
          sha256sum "$release_apk" > "$release_apk.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "NoClearAll-${GITHUB_REF_NAME}.apk" \
            "NoClearAll-${GITHUB_REF_NAME}.apk.sha256" \
            --verify-tag \
            --generate-notes \
            --title "NoClearAll ${GITHUB_REF_NAME}"
